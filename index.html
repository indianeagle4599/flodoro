<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>

<!-- 🔔 Audio notification chime -->
<audio id="notification-sound" src="assets/audio/notify.mp3" preload="auto"></audio>

<!-- 💬 Toast container -->
<div id="toast" class="toast hidden" role="alert"></div>

<style>
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .toast.show {
    opacity: 1;
  }
</style>


<body>
  <div id="app" tabindex="0">
    <header class="app-header">
      <!-- We intentionally omit the Pomodoro Timer heading for a cleaner look -->
      <!-- Place the header tray on the left for intuitive access -->
      <div class="header-tray">
        <button id="tasks-button" class="icon-button" aria-label="Tasks" title="Tasks">📋</button>
        <button id="history-button" class="icon-button" aria-label="History" title="History">📊</button>
        <button id="stats-button" class="icon-button" aria-label="Statistics" title="Statistics">📈</button>
        <button id="audio-settings-button" class="icon-button" aria-label="Audio Settings"
          title="Audio Settings">🎵</button>
        <button id="settings-button" class="icon-button" aria-label="Settings" title="Settings">⚙️</button>
      </div>
    </header>
    <main class="main-content">
      <!-- User's selected quote of the day (if any) -->
      <div id="theme-quote-display" class="theme-quote hidden"></div>
      <!-- Motivational quote display shown during breaks; clicking cycles through quotes and a star button allows favouriting -->
      <div id="quote-display" class="quote-display hidden" role="button" aria-label="Break quote"></div>
      <!-- Mode toggle: click to switch between work and break sessions -->
      <div id="mode-toggle" class="mode-toggle" role="button" tabindex="0" aria-label="Toggle work/break">
        <span id="mode-main" class="mode-main">Work</span>
        <span id="mode-sub" class="mode-sub">Break</span>
      </div>
      <!-- Session label and timer wrapped with plus/minus controls -->
      <div id="session-label" class="session-label">Work</div>
      <div id="timer-wrapper" class="timer-wrapper">
        <button id="add-minute" class="icon-button time-adjust-btn" aria-label="Add one minute">+</button>
        <div id="timer-display" class="timer-display">25:00</div>
        <button id="subtract-minute" class="icon-button time-adjust-btn" aria-label="Remove one minute">−</button>
      </div>
      <div id="controls" class="controls">
        <button id="start-button" class="control-button" aria-label="Start / Pause" title="Start / Pause">▶</button>
        <button id="reset-button" class="control-button" aria-label="Reset" title="Reset">⟳</button>
        <button id="postpone-button" class="control-button hidden">Postpone Break</button>
      </div>

      <!-- Display the current task (if task manager is enabled) -->
      <div id="current-task" class="current-task hidden"></div>

      <!-- Display flagged (starred) tasks prominently -->
      <div id="flagged-tasks-display" class="flagged-tasks-display hidden"></div>
    </main>
    <!-- Settings panel: slides out from the top right under the settings button. Hides when not active. -->
    <div id="settings-panel" class="settings-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="settings-title">
      <h2 id="settings-title" class="settings-title">Settings</h2>
      <div class="settings-content">
        <!-- Duration settings grouped into two rows for cleaner layout -->
        <div class="settings-row">
          <div class="settings-group">
            <label for="work-duration">Work&nbsp;(min)</label>
            <input type="number" id="work-duration" min="1" value="25" />
          </div>
          <div class="settings-group">
            <label for="short-break-duration">Short&nbsp;break&nbsp;(min)</label>
            <input type="number" id="short-break-duration" min="1" value="5" />
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-group">
            <label for="long-break-duration">Long&nbsp;break&nbsp;(min)</label>
            <input type="number" id="long-break-duration" min="1" value="15" />
          </div>
          <div class="settings-group">
            <label for="sessions-before-long">Pomodoros&nbsp;before&nbsp;long&nbsp;break</label>
            <input type="number" id="sessions-before-long" min="1" value="4" />
          </div>
        </div>
        <!-- Colour settings: gradient, accent and colour mode toggle in one row -->
        <div class="settings-row">
          <div class="settings-group">
            <label>Gradient</label>
            <div class="color-input-row">
              <input type="color" id="bg-color1" value="#3358a2" />
              <input type="color" id="bg-color2" value="#8f5bbb" />
            </div>
          </div>
          <div class="settings-group">
            <label for="color-picker">Accent</label>
            <input type="color" id="color-picker" value="#3b82f6" />
          </div>
          <div class="settings-group">
            <label for="color-mode-toggle">Mode</label>
            <button id="color-mode-toggle" class="toggle-button" aria-label="Toggle colour mode">Dark&nbsp;Mode</button>
          </div>
        </div>
        <!-- Theme preset selection (always below custom colour choices) -->
        <div class="settings-group">
          <label for="theme-preset-select">Theme&nbsp;preset</label>
          <select id="theme-preset-select">
            <option value="custom">Custom</option>
            <option value="apple-blue">Apple&nbsp;Blue</option>
            <option value="apple-green">Apple&nbsp;Green</option>
            <option value="apple-pink">Apple&nbsp;Pink</option>
            <option value="apple-steel">Apple&nbsp;Steel</option>
            <option value="apple-white">Apple&nbsp;White</option>
            <option value="apple-silver">Apple&nbsp;Silver</option>
            <option value="apple-golden">Apple&nbsp;Golden</option>
          </select>
        </div>
        <div class="settings-group notification-launch-group">
          <label id="notification-settings-label">Notifications</label>
          <div class="notification-launch-row">
            <span id="notification-settings-summary" class="settings-summary" aria-live="polite"></span>
            <button id="notification-settings-button" class="icon-button compact-panel-button" type="button"
              aria-label="Notification Settings" title="Notification Settings">🔔</button>
          </div>
        </div>
        <!-- Settings actions -->
        <div class="settings-actions">
          <button id="save-settings" class="control-button">Save</button>
          <button id="close-settings" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <div id="notification-panel" class="notification-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="notification-title">
      <h2 id="notification-title" class="panel-title">Notification Settings</h2>
      <div class="notification-content">
        <div id="notification-settings-container"></div>
        <div class="notification-actions">
          <button id="back-notifications" class="control-button">Back</button>
          <button id="close-notifications" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Tasks panel: lists and manages tasks independently of settings -->
    <div id="tasks-panel" class="tasks-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="tasks-title">
      <h2 id="tasks-title" class="panel-title">Tasks</h2>
      <div class="tasks-content">
        <div class="task-input-row">
          <input type="text" id="new-task-input" placeholder="Add a new task" />
          <button id="add-task-button" class="icon-button" aria-label="Add task">+</button>
        </div>
        <ul id="tasks-list" class="tasks-list"></ul>
        <div class="tasks-actions">
          <button id="close-tasks" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- History panel: displays completed work/break sessions -->
    <div id="history-panel" class="history-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="history-title">
      <h2 id="history-title" class="panel-title">History</h2>
      <div class="history-content">
        <ul id="history-list" class="history-list"></ul>
        <div class="history-actions">
          <button id="clear-history" class="control-button">Clear</button>
          <button id="close-history" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Audio settings panel: selects track, volume and progress -->
    <div id="audio-panel" class="audio-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="audio-title">
      <h2 id="audio-title" class="panel-title">Audio Settings</h2>
      <div class="audio-content">
        <!-- Genre selection -->
        <div class="settings-group">
          <!-- Genre selection -->
          <div class="settings-group">
            <label for="audio-genre-select">Audio Playlist</label>
            <select id="audio-genre-select"><!-- options injected by JS --></select>
          </div>

        </div>
        <!-- Track selection within genre -->
        <div class="settings-group">
          <label for="audio-select">Track</label>
          <select id="audio-select">
            <option value="none">None</option>
            <!-- Track options will be populated dynamically -->
          </select>
        </div>
        <!-- Playback controls – circular pill buttons -->
        <div class="audio-playback-row">
          <button id="prev-track" class="pill-btn" aria-label="Previous">⏮</button>
          <button id="audio-play-pause" class="pill-btn" aria-label="Play / pause">▶</button>
          <button id="next-track" class="pill-btn" aria-label="Next">⏭</button>
        </div>
        <!-- Volume and mute -->
        <div class="volume-row">
          <button id="mute-toggle" class="icon-button" aria-label="Toggle mute">🔊</button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <!-- Audio progress bar (shown when a track is loaded) -->
        <div class="settings-group audio-progress-group hidden">
          <label for="audio-progress">Audio position</label>
          <input type="range" id="audio-progress" min="0" max="100" step="0.1" value="0" />
        </div>
        <div class="audio-actions">
          <button id="close-audio" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Statistics panel: shows counts of sessions and tasks -->
    <div id="stats-panel" class="stats-panel slideout hidden" role="dialog" aria-modal="true"
      aria-labelledby="stats-title">
      <h2 id="stats-title" class="panel-title">Statistics</h2>
      <div class="stats-content">
        <div id="stats-summary" class="stats-summary"></div>
        <div class="stats-actions">
          <button id="close-stats" class="control-button">Close</button>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio-player" preload="auto"></audio>
  <script src="audioManifest.js"></script>
  <script src="app.js"></script>
</body>

</html>
