<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" tabindex="0">
    <header class="app-header">
      <h1 class="app-title">Pomodoro Timer</h1>
      <!-- Header buttons: settings, tasks and history -->
      <div class="header-buttons">
        <button id="tasks-button" class="icon-button" aria-label="Tasks" title="Tasks">📋</button>
        <button id="history-button" class="icon-button" aria-label="History" title="History">📊</button>
        <button id="stats-button" class="icon-button" aria-label="Statistics" title="Statistics">📈</button>
        <button id="audio-settings-button" class="icon-button" aria-label="Audio Settings" title="Audio Settings">🎵</button>
        <button id="settings-button" class="icon-button" aria-label="Settings" title="Settings">⚙️</button>
      </div>
    </header>
    <main class="main-content">
      <!-- Mode toggle: click to switch between work and break sessions -->
      <div id="mode-toggle" class="mode-toggle" role="button" tabindex="0" aria-label="Toggle work/break">
        <span id="mode-main" class="mode-main">Work</span>
        <span id="mode-sub" class="mode-sub">Break</span>
      </div>
      <!-- Session label and timer -->
      <div id="session-label" class="session-label">Work</div>
      <div id="timer-display" class="timer-display">25:00</div>
      <div id="controls" class="controls">
        <button id="start-button" class="control-button">Start</button>
        <button id="reset-button" class="control-button">Reset</button>
        <button id="postpone-button" class="control-button hidden">Postpone Break</button>
      </div>

      <!-- Secondary controls: adjust time, skip sessions, audio control -->
      <div id="secondary-controls" class="secondary-controls">
        <button id="add-minute" class="icon-button" aria-label="Add one minute">+1&nbsp;min</button>
        <button id="subtract-minute" class="icon-button" aria-label="Remove one minute">−1&nbsp;min</button>
        <button id="audio-toggle" class="icon-button" aria-label="Toggle audio">🔈</button>
      </div>

      <!-- Display the current task (if task manager is enabled) -->
      <div id="current-task" class="current-task hidden"></div>

      <!-- Motivational quote display shown during breaks -->
      <div id="quote-display" class="quote-display hidden"></div>
    </main>
    <!-- Settings panel: slides out from the top right under the settings button. Hides when not active. -->
    <div id="settings-panel" class="settings-panel slideout hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title" class="settings-title">Settings</h2>
      <div class="settings-content">
        <!-- Duration settings -->
        <div class="settings-group">
          <label for="work-duration">Work (min)</label>
          <input type="number" id="work-duration" min="1" value="25" />
        </div>
        <div class="settings-group">
          <label for="short-break-duration">Short break (min)</label>
          <input type="number" id="short-break-duration" min="1" value="5" />
        </div>
        <div class="settings-group">
          <label for="long-break-duration">Long break (min)</label>
          <input type="number" id="long-break-duration" min="1" value="15" />
        </div>
        <div class="settings-group">
          <label for="sessions-before-long">Pomodoros before long break</label>
          <input type="number" id="sessions-before-long" min="1" value="4" />
        </div>
        <!-- Wallpaper and audio selection -->
        <div class="settings-group">
          <label for="wallpaper-select">Background</label>
          <select id="wallpaper-select">
            <option value="gradient_cool.png">Cool Gradient</option>
            <option value="gradient_warm.png">Warm Gradient</option>
            <option value="abstract_green.png">Abstract Green</option>
            <option value="gradient_forest.png">Forest Gradient</option>
            <option value="gradient_sunset.png">Sunset Gradient</option>
            <option value="gradient_pastel.png">Pastel Gradient</option>
            <option value="shuffle">Shuffle</option>
          </select>
        </div>
        <!-- Theme color selection -->
        <div class="settings-group">
          <label for="color-picker">Theme color</label>
          <input type="color" id="color-picker" value="#3b82f6" />
        </div>
        <!-- Theme preset selection -->
        <div class="settings-group">
          <label for="theme-preset-select">Theme preset</label>
          <select id="theme-preset-select">
            <option value="custom">Custom</option>
            <option value="apple-blue">Apple Blue</option>
            <option value="apple-green">Apple Green</option>
            <option value="apple-pink">Apple Pink</option>
          </select>
        </div>
        <!-- Dark mode toggle -->
        <div class="settings-group">
          <label for="dark-mode-toggle">Dark mode</label>
          <input type="checkbox" id="dark-mode-toggle" />
        </div>
        <!-- Task manager -->
        <!-- Task manager input removed; tasks are managed via tasks panel -->
        <div class="settings-actions">
          <button id="save-settings" class="control-button">Save</button>
          <button id="close-settings" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Tasks panel: lists and manages tasks independently of settings -->
    <div id="tasks-panel" class="tasks-panel slideout hidden" role="dialog" aria-modal="true" aria-labelledby="tasks-title">
      <h2 id="tasks-title" class="panel-title">Tasks</h2>
      <div class="tasks-content">
        <div class="task-input-row">
          <input type="text" id="new-task-input" placeholder="Add a new task" />
          <button id="add-task-button" class="icon-button" aria-label="Add task">+</button>
        </div>
        <ul id="tasks-list" class="tasks-list"></ul>
        <div class="tasks-actions">
          <button id="close-tasks" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- History panel: displays completed work/break sessions -->
    <div id="history-panel" class="history-panel slideout hidden" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <h2 id="history-title" class="panel-title">History</h2>
      <div class="history-content">
        <ul id="history-list" class="history-list"></ul>
        <div class="history-actions">
          <button id="clear-history" class="control-button">Clear</button>
          <button id="close-history" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Audio settings panel: selects track, volume and progress -->
    <div id="audio-panel" class="audio-panel slideout hidden" role="dialog" aria-modal="true" aria-labelledby="audio-title">
      <h2 id="audio-title" class="panel-title">Audio Settings</h2>
      <div class="audio-content">
        <div class="settings-group">
          <label for="audio-select">Audio track</label>
          <select id="audio-select">
            <option value="none">None</option>
            <option value="track1">Focus Track 1</option>
            <option value="track2">Focus Track 2</option>
          </select>
        </div>
        <div class="volume-row">
          <button id="mute-toggle" class="icon-button" aria-label="Toggle mute">🔊</button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" />
        </div>
        <div class="settings-group audio-progress-group hidden">
          <label for="audio-progress">Audio position</label>
          <input type="range" id="audio-progress" min="0" max="100" step="0.1" value="0" />
        </div>
        <div class="audio-actions">
          <button id="close-audio" class="control-button">Close</button>
        </div>
      </div>
    </div>
    <!-- Statistics panel: shows counts of sessions and tasks -->
    <div id="stats-panel" class="stats-panel slideout hidden" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <h2 id="stats-title" class="panel-title">Statistics</h2>
      <div class="stats-content">
        <div id="stats-summary" class="stats-summary"></div>
        <div class="stats-actions">
          <button id="close-stats" class="control-button">Close</button>
        </div>
      </div>
    </div>
  </div>
  <audio id="audio-player" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
